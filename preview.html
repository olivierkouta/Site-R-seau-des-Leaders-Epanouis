<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulateur iPhone 13 - RLE</title>
  <style>
    body { 
      background: #111; 
      color: white; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 2rem; 
      margin: 0; 
      min-height: 100vh; 
    }
    h1 { margin-bottom: 2rem; font-weight: 400; font-size: 1.5rem; color: #aaa; }
    .device-mockup {
      width: 390px;
      height: 844px;
      border: 14px solid #000;
      border-radius: 50px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      background: white;
    }
    /* Encoche (Notch) iPhone */
    .notch {
      position: absolute;
      top: -1px; left: 50%;
      transform: translateX(-50%);
      width: 160px; height: 32px;
      background: #000;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      z-index: 10;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Scrollbar invisible pour faire plus réaliste */
      scrollbar-width: none; 
    }
    iframe::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <h1>Aperçu Simulateur (iPhone 13 - 390x844)</h1>
  <div class="device-mockup">
    <div class="notch"></div>
    <iframe src="index.html"></iframe>
  </div>
</body>
</html>
